channel_name: "Built on Bharat"
handle: "@BuiltOnBharat"
tagline: "The empires and habits that built a nation"
colors:
  bg: "#0D0E11"          # deep matte charcoal (main)
  bg_alt: "#121212"      # deep matte charcoal (alternate)
  bronze: "#C57D3C"      # accent: the story's key thing
  gold: "#D4AF37"        # accent: highlights, counters landing
  ink: "#FFFFFF"         # text primary
  muted: "#8E929B"       # text secondary, blueprint lines
